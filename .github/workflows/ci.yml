name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # PostgreSQL with pgvector, for the Postgres adapter's conformance suite,
    # and MinIO, for the s3 object-store provider's. MinIO no longer publishes
    # images; Bitnami's legacy image is pinned to the last community release.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: agentforeach
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      minio:
        image: bitnamilegacy/minio:2025.5.24@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
        env:
          MINIO_ROOT_USER: agentforeach
          MINIO_ROOT_PASSWORD: agentforeach-minio
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -sf http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The gateway imports the storage and platform packages' compiled output.
      - name: Build storage packages
        run: npm run build:storage
      - name: Build platform packages
        run: npm run build:platform
      - name: Typecheck gateway
        run: npx tsc --noEmit -p gateway
      - name: Typecheck infra
        run: npx tsc --noEmit -p infra
      # The Worker entry and what it imports, against the Workers runtime types for its
      # compatibility date and flags (generated by wrangler types).
      - name: Typecheck the Cloudflare Worker
        run: npm run typecheck:worker
      - name: Test storage SDK
        run: npm test --workspace @agentforeach/storage
      - name: Test Cosmos adapter
        run: npm test --workspace @agentforeach/storage-cosmos
      - name: Test Postgres adapter (conformance against the pgvector service)
        run: npm test --workspace @agentforeach/storage-postgres
        env:
          STORAGE_POSTGRES_URL: postgres://postgres:agentforeach@localhost:5432/postgres
      # Azurite for the azure-blob provider's conformance suite. It runs as a
      # step, not a service, because it needs --skipApiVersionCheck.
      - name: Start Azurite (Blob)
        run: >-
          docker run -d -p 10000:10000
          mcr.microsoft.com/azure-storage/azurite@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
          azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --loose
      - name: Test platform SDK (object-store conformance against the MinIO service)
        run: npm test --workspace @agentforeach/platform
        env:
          OBJECTS_S3_ENDPOINT: http://localhost:9000
          OBJECTS_S3_ACCESS_KEY_ID: agentforeach
          OBJECTS_S3_SECRET_ACCESS_KEY: agentforeach-minio
      - name: Test Azure platform pack (object-store conformance against Azurite)
        run: npm test --workspace @agentforeach/platform-azure
        env:
          OBJECTS_AZURE_CONNECTION_STRING: UseDevelopmentStorage=true
      - name: Test the deploy script helpers (against a fake Cloudflare API)
        run: node --test 'scripts/lib/*.test.mjs'
      - name: Test Cloudflare platform pack
        run: npm test --workspace @agentforeach/platform-cloudflare
      - name: Test
        run: npm test --workspace @agentforeach/gateway
      # The Cloudflare Worker must not reach Azure-only code.
      - name: Check the Cloudflare Worker bundle
        run: npm run check:bundle
      # The realtime and durable conformance suites on workerd (local wrangler dev, no account).
      - name: Realtime conformance on workerd
        run: node packages/platform-cloudflare/conformance/realtime/run.mjs
      - name: Durable conformance on workerd
        run: node packages/platform-cloudflare/conformance/durable/run.mjs
      - name: Host conformance on workerd
        run: node packages/platform-cloudflare/conformance/host/run.mjs

  # The browser driver's page-socket guard in a real Chromium: Playwright's
  # request routes don't see WebSockets, so only a browser proves the guard.
  # Playwright is the driver's own pinned dependency, installed as the sandbox
  # image installs it.
  browser-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the driver's Playwright
        working-directory: gateway/sandbox-container/browser
        run: npm install --omit=dev --no-fund --no-audit
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('gateway/sandbox-container/browser/package.json') }}
      - name: Install Chromium and its system libraries
        working-directory: gateway/sandbox-container/browser
        run: npx playwright-core install --with-deps chromium
      - name: Test the page-socket guard in Chromium
        run: node --test gateway/sandbox-container/browser/sockets.browser.test.mjs
        env:
          BROWSER_TEST_REQUIRED: "1"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source /repo --redact --verbose
