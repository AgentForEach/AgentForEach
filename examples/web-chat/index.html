<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentForEach web chat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
  /* AgentForEach "Tungsten on Night": dim is asleep, amber is awake. */
  :root {
    --bg: #F6F6F7; --surface: #FFFFFF; --raised: #EFEFF2; --fg: #0B0B0C; --muted: #63636B; --line: #E4E4E7;
    --wake: #F09A1A; --wake-bg: #FFE3B8; --tile: #E4E5EA; --wake-ink: #9A5B00; --on-wake: #2A1700; --sleep: #E6E7EB; --depth: #FFFFFF;
    --display: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
    --body: "Instrument Sans", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #080C14; --surface: #0C121D; --raised: #152033; --fg: #EEF1F6; --muted: #8C97AA; --line: #1E2838;
      --wake: #FFB547; --wake-bg: #FFD08A; --tile: #243044; --wake-ink: #FFB547; --sleep: #1C2636; --depth: #0F1726; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); background-image: linear-gradient(180deg, var(--depth), var(--bg) 320px); color: var(--fg); font: 15px/1.5 var(--body); }
  main { max-width: 760px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; height: 100dvh; gap: 12px; }
  header { display: flex; align-items: center; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 8px; font: 700 18px var(--display); letter-spacing: -.01em; }
  .brand b { color: var(--wake-ink); font-weight: 700; }
  .brand small { font: 400 12px var(--mono); color: var(--muted); letter-spacing: .02em; margin-left: 4px; }
  #agent { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  #avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--sleep); overflow: hidden; flex: none; transition: box-shadow .4s, background .4s; }
  #avatar svg { display: block; width: 100%; height: 100%; opacity: .5; transition: opacity .4s; }
  #agent.awake #avatar { background: var(--wake-bg); box-shadow: 0 0 0 2px var(--wake), 0 0 18px color-mix(in srgb, var(--wake) 45%, transparent); }
  #agent.awake #avatar svg { opacity: 1; }
  #agent.awake #agentState { color: var(--wake-ink); }
  @media (prefers-reduced-motion: reduce) { #avatar, #avatar svg { transition: none; } }
  fieldset { border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: grid; gap: 10px; background: var(--surface); margin: 0; }
  legend { font: 400 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 0 6px; }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  input, button { font: inherit; }
  input { padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--fg); width: 100%; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--wake); outline-offset: 2px; }
  button { padding: 9px 16px; border: 0; border-radius: 999px; background: var(--wake); color: var(--on-wake); font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  #status { color: var(--muted); font: 400 12px/1.5 var(--mono); min-height: 1.5em; margin: 0 2px; }
  #log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 0; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .me { align-self: flex-end; background: var(--raised); border-bottom-right-radius: 6px; }
  .agent { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
  .note { align-self: center; color: var(--muted); font-size: 13px; }
  .card { align-self: flex-start; max-width: 85%; border: 1px solid var(--wake); background: var(--surface); border-radius: 16px; padding: 12px 14px; display: grid; gap: 10px; }
  .card h3 { margin: 0; font: 600 15px var(--body); }
  .card p { margin: 0; color: var(--muted); white-space: pre-wrap; }
  .card .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .card button.secondary { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  .card label.check { display: flex; gap: 8px; align-items: center; color: var(--fg); font-size: 15px; }
  .card label.check input { width: auto; }
  .card.handoff { max-width: 100%; width: 100%; }
  .card iframe.handoff { width: 100%; height: min(72vh, 720px); border: 0; border-radius: 10px; background: #151827; }
  .reminder { border-color: var(--wake); }
  .reminder::before { content: "Reminder"; display: block; font: 400 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--wake-ink); margin-bottom: 4px; }
  form#send { display: flex; gap: 8px; padding-top: 4px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr; } .brand small { display: none; } }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 100 100" aria-hidden="true"><rect x="8" y="8" width="24" height="24" rx="6" fill="var(--tile)"/><rect x="38" y="8" width="24" height="24" rx="6" fill="var(--tile)"/><rect x="68" y="8" width="24" height="24" rx="6" fill="var(--wake)"/><rect x="8" y="38" width="24" height="24" rx="6" fill="var(--tile)"/><rect x="38" y="38" width="24" height="24" rx="6" fill="var(--tile)"/><rect x="68" y="38" width="24" height="24" rx="6" fill="var(--tile)"/><rect x="8" y="68" width="24" height="24" rx="6" fill="var(--tile)"/><rect x="38" y="68" width="24" height="24" rx="6" fill="var(--tile)"/><rect x="68" y="68" width="24" height="24" rx="6" fill="var(--tile)"/></svg>
      <span>Agent<b>ForEach</b><small>web chat sample</small></span>
    </div>
    <div id="agent" title="Dim while your agent is asleep, lit while it works">
      <span id="agentState">asleep</span>
      <div id="avatar" role="img" aria-label="Your agent"></div>
    </div>
  </header>
  <form id="connect">
    <fieldset>
      <legend>Gateway</legend>
      <label>URL <input id="baseUrl" value="http://localhost:7071" required></label>
      <div class="row">
        <label>Bearer token (JWT) <input id="token" type="password" autocomplete="off" placeholder="leave empty for local dev"></label>
        <label>Dev user id (local only, x-user-id) <input id="devUser" value="me"></label>
      </div>
      <button id="connectBtn">Connect</button>
    </fieldset>
  </form>
  <div id="status">Not connected.</div>
  <div id="log" aria-live="polite"></div>
  <form id="send">
    <input id="message" placeholder="Message" autocomplete="off" disabled>
    <button id="sendBtn" disabled>Send</button>
  </form>
</main>
<script>
// A minimal client for the AgentForEach gateway, no build step. The flow:
//   1. GET /negotiate                 -> { url } with a per-user token, plus a
//                                        { descriptor } where the realtime service
//                                        isn't protocol v1 (AWS AppSync Events)
//   2. the portable realtime client (./realtime-client.js, generated from
//      packages/platform/src/realtime/client) connects to either, and
//      reconnects with a fresh token when the connection drops
//   3. POST /api/chat                 -> 202 { runId, sessionId } (Azure), or
//                                        200 with the reply (local, synchronous)
//   4. the reply streams as { type: "event", event: "chat", payload } frames:
//      payload.state "delta" (delta, offset), "final" (text), "error", ...
//   5. a form (payload.state "input_request") is answered by POST /api/chat
//      with hitlInputResponse { requestId, data | cancelled }; a gated tool's form
//      answers 202 { resumed: true } and the run continues; a "browser_handoff"
//      form embeds the live view of the agent's browser (docs/Browser.md)
//   6. a scheduled job's result (a reminder) arrives as event "cron"
//   7. recovery, where the gateway serves it: GET /api/chat/runs/{runId} for an
//      accepted turn, then the saved reply by run id from GET /api/sessions/{id};
//      GET /api/hitl/pending for unanswered forms; GET /api/hitl/{requestId}
//      after an accepted answer (resumed, or approvalAccepted), until it names the
//      run that continued (resumedRunId). Without them (404) nothing changes.
// See docs/Architecture.md, "Real-time protocol", and docs/HITL.md.

const $ = (id) => document.getElementById(id);
const state = { baseUrl: "", headers: {}, sessionId: undefined, ws: undefined, bubbles: new Map(), forms: new Map(), completed: new Set(), generation: 0 };

function setStatus(text) { $("status").textContent = text; }

// The agent's portrait is dim while it sleeps and lit while a turn runs.
function setAwake(awake) {
  $("agent").classList.toggle("awake", awake);
  $("agentState").textContent = awake ? "awake" : "asleep";
}

function addBubble(kind, text) {
  const el = document.createElement("div");
  el.className = `msg ${kind}`;
  el.textContent = text; // never innerHTML: replies are untrusted text
  $("log").append(el);
  el.scrollIntoView({ block: "end" });
  return el;
}

// One portrait per user: the JWT's subject, or the dev user id.
function avatarSeed() {
  const token = $("token").value.trim();
  try { if (token) return JSON.parse(atob(token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).sub || "agent"; } catch {}
  return $("devUser").value.trim() || "agent";
}

function authHeaders() {
  const token = $("token").value.trim();
  const devUser = $("devUser").value.trim();
  if (token) return { authorization: `Bearer ${token}` };
  if (devUser) return { "x-user-id": devUser }; // honoured only when AUTH_ALLOW_INSECURE_USER_ID_HEADER=true, never on Azure
  return {};
}

// ---- Forms (human in the loop) --------------------------------------------

function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

/** Render an input request as a card; answering it resumes the paused run. */
function showForm(p) {
  const fields = [];
  const card = el("div", { className: "card" }, el("h3", { textContent: p.formName || "Input needed" }));
  if (p.intent) card.append(el("p", { textContent: p.intent }));
  const actions = el("div", { className: "actions" });

  const answer = (data, summary) => submitForm(p, card, { data }, summary);

  // The agent handed its browser to the user: show it live; Done or Cancel gives it back.
  if (p.formType === "browser_handoff" && typeof p.proposedArgs?.viewerUrl === "string" && p.proposedArgs.viewerUrl.startsWith("http")) {
    card.classList.add("handoff");
    const view = el("iframe", { src: p.proposedArgs.viewerUrl, className: "handoff", title: "The agent's browser" });
    view.setAttribute("allow", "clipboard-read; clipboard-write");
    const handBack = (message) => view.contentWindow?.postMessage(message, new URL(view.src).origin);
    card.append(view);
    actions.append(el("button", { textContent: "Done", onclick: () => { handBack("afe-handoff-done"); answer({ done: true }, "Done"); } }));
    actions.append(el("button", { className: "secondary", textContent: "Cancel", onclick: () => { handBack("afe-handoff-cancel"); submitForm(p, card, { cancelled: true }, "Cancelled"); } }));
    card.append(actions);
    $("log").append(card);
    card.scrollIntoView({ block: "end" });
    state.forms.set(p.requestId, card);
    return;
  }

  const options = Array.isArray(p.options) ? p.options : [];
  const properties = p.schema && typeof p.schema.properties === "object" ? Object.entries(p.schema.properties) : [];

  if (options.length && p.formType === "multi_select") {
    for (const o of options) {
      const box = el("input", { type: "checkbox", value: o.value });
      fields.push(box);
      card.append(el("label", { className: "check" }, box, o.label));
    }
    actions.append(el("button", { textContent: "Submit", onclick: () => {
      const picked = fields.filter((f) => f.checked);
      answer({ values: picked.map((f) => f.value) }, picked.map((f) => f.parentElement.textContent).join(", ") || "None");
    } }));
  } else if (options.length) {
    for (const o of options) actions.append(el("button", { textContent: o.label, onclick: () => answer({ value: o.value }, o.label) }));
  } else if (properties.length || p.formType === "text_input" || p.formType === "form") {
    const props = properties.length ? properties : [["text", { title: "Your answer" }]];
    for (const [key, spec] of props) {
      const input = el("input", { name: key, placeholder: spec.description ?? "" });
      if (p.proposedArgs?.[key] !== undefined) input.value = String(p.proposedArgs[key]);
      fields.push(input);
      card.append(el("label", {}, spec.title ?? key, input));
    }
    actions.append(el("button", { textContent: "Submit", onclick: () => {
      const data = Object.fromEntries(fields.map((f) => [f.name, f.value]));
      answer(data, fields.map((f) => f.value).join(", "));
    } }));
  } else {
    actions.append(el("button", { textContent: "Approve", onclick: () => answer({ approved: true, confirmed: true }, "Approved") }));
  }
  actions.append(el("button", { className: "secondary", textContent: "Cancel", onclick: () => submitForm(p, card, { cancelled: true }, "Cancelled") }));
  card.append(actions);
  $("log").append(card);
  card.scrollIntoView({ block: "end" });
  state.forms.set(p.requestId, card);
}

function closeForm(requestId, note) {
  const card = state.forms.get(requestId);
  if (!card) return;
  card.querySelectorAll("button, input").forEach((n) => (n.disabled = true));
  // A live view closes with its form, just after it has passed Done or Cancel on to the browser.
  card.querySelectorAll("iframe").forEach((n) => setTimeout(() => n.remove(), 500));
  if (note) card.append(el("p", { textContent: note }));
  state.forms.delete(requestId);
}

async function submitForm(p, card, response, summary) {
  closeForm(p.requestId);
  addBubble("me", summary);
  await post({ message: summary, hitlInputResponse: { requestId: p.requestId, ...response } });
}

function onChatEvent(p) {
  if (p.state === "input_request") return showForm(p);
  if (p.state === "input_expired") return closeForm(p.requestId, "This form timed out.");
  // A run ends once: a recovered reply and a late live one never both show.
  if (!p.runId || state.completed.has(p.runId)) return;
  if (["final", "error", "aborted"].includes(p.state)) {
    state.completed.add(p.runId);
    if (state.completed.size > 100) state.completed.delete(state.completed.values().next().value);
  }
  let entry = state.bubbles.get(p.runId);
  if (!entry) {
    entry = { el: addBubble("agent", ""), text: "" };
    state.bubbles.set(p.runId, entry);
  }
  if (p.sessionId) state.sessionId = p.sessionId;
  switch (p.state) {
    case "thinking": setAwake(true); setStatus("Thinking…"); break;
    case "tool_start": setAwake(true); setStatus(`Using ${p.name ?? p.toolType}…`); break;
    case "delta":
      setAwake(true);
      // A gap means a frame was missed; "final" carries the full text anyway.
      if (p.offset === entry.text.length) entry.text += p.delta;
      entry.el.textContent = entry.text;
      break;
    case "final":
      entry.el.textContent = p.text;
      setAwake(false);
      setStatus(`Done (${p.model}, ${(p.durationMs / 1000).toFixed(1)} s).`);
      state.bubbles.delete(p.runId);
      break;
    case "error":
      setAwake(false);
      entry.el.textContent = `Error: ${p.error}`;
      setStatus(p.code ? `Error: ${p.code}` : "Error.");
      state.bubbles.delete(p.runId);
      break;
    case "aborted": setAwake(false); setStatus("Stopped."); state.bubbles.delete(p.runId); break;
  }
}

// A frame pushed to this user: a chat event, or a scheduled job's result.
function onFrame(data) {
  if (data?.type === "event" && data.event === "chat" && data.payload) onChatEvent(data.payload);
  if (data?.type === "event" && data.event === "cron" && data.payload) {
    const r = data.payload;
    addBubble("agent reminder", `${r.jobName}${r.summary ? `\n${r.summary}` : ""}`);
    setAwake(true); setTimeout(() => setAwake(false), 2500);
  }
}

async function connect() {
  const baseUrl = $("baseUrl").value.trim().replace(/\/+$/, "");
  const headers = authHeaders();
  // Another gateway or user starts over: recoveries in flight stop, and the
  // previous user's conversation and forms go. Reconnecting as the same user keeps them.
  if (baseUrl !== state.baseUrl || JSON.stringify(headers) !== JSON.stringify(state.headers)) {
    state.generation++;
    state.sessionId = undefined;
    state.bubbles.clear(); state.completed.clear();
    for (const requestId of [...state.forms.keys()]) closeForm(requestId);
    $("log").replaceChildren();
  }
  const generation = state.generation;
  state.baseUrl = baseUrl;
  state.headers = headers;
  window.afeAvatar?.(avatarSeed());
  state.ws?.close();
  state.ws = undefined;
  setStatus("Connecting…");
  // Local runs without real-time still work: /api/chat answers synchronously.
  const noStream = (err) => setStatus(`No live stream (${err.message}). Replies will arrive when complete.`);
  try {
    const { keepConnected } = await import("./realtime-client.js");
    const { baseUrl: base, headers: auth } = state;
    let live, opened = false;
    live = keepConnected({
      // Each attempt negotiates a fresh token.
      access: async () => {
        const res = await fetch(`${base}/negotiate`, { headers: auth });
        if (res.status === 401) throw new Error("401: set up sign-in (auth.providers) or use a dev user id locally");
        if (!res.ok) throw new Error(`negotiate returned ${res.status}`);
        const body = await res.json();
        return body.descriptor ?? { protocol: "v1", url: body.url };
      },
      onMessage: onFrame,
      maxAttempts: 8,
      onState(phase, { error }) {
        if (phase === "connecting" || state.ws !== live) return;
        if (phase === "open") {
          opened = true;
          setStatus("Connected. Replies stream live.");
          void restorePendingForms(generation);
        } else if (phase === "retrying" && !opened) {
          // The first connection failed: no live stream here, so don't keep trying.
          live.close();
          state.ws = undefined;
          noStream(error);
        } else if (phase === "retrying") setStatus(`Live stream interrupted (${error.message}). Reconnecting…`);
        else if (phase === "closed") { state.ws = undefined; setStatus("Disconnected. Connect again to stream replies."); }
      },
    });
    state.ws = live;
  } catch (err) {
    noStream(err);
  }
  $("message").disabled = false;
  $("sendBtn").disabled = false;
  $("message").focus();
}

// Live delivery can drop a reply (a reconnect, a missed frame). Where the gateway
// serves run status, the saved reply is authoritative: poll it, and show the reply
// by run id. A gateway without the route answers 404 (or, cross-origin, fails like a
// network error every time), and then the page carries on as before.
async function recoverRun(runId, sessionId, generation, baseUrl, headers) {
  let reachable = false, misses = 0;
  try {
    for (let attempt = 0; attempt < 220; attempt++) {
      await new Promise((resolve) => setTimeout(resolve, 3000));
      if (generation !== state.generation || state.completed.has(runId)) return;
      const response = await fetch(`${baseUrl}/api/chat/runs/${encodeURIComponent(runId)}`, { headers, signal: AbortSignal.timeout(10000) }).catch(() => null);
      if (!response) { if (!reachable && ++misses >= 5) return; continue; }
      reachable = true;
      if (response.status === 404) return; // no run-status route on this gateway
      if (response.status === 429 || response.status >= 500) continue;
      if (!response.ok) throw new Error(`run status returned ${response.status}`);
      const run = await response.json();
      if (["accepted", "running"].includes(run.status)) continue;
      if (generation !== state.generation || state.completed.has(runId)) return;
      if (run.status === "completed") {
        const saved = await fetch(`${baseUrl}/api/sessions/${encodeURIComponent(sessionId)}`, { headers, signal: AbortSignal.timeout(10000) }).catch(() => null);
        if (!saved || saved.status === 429 || saved.status >= 500) continue;
        if (!saved.ok) throw new Error("Could not recover the saved reply");
        const session = await saved.json();
        const reply = session.messages?.filter((message) => message.runId === runId && message.role === "assistant").at(-1);
        if (generation !== state.generation || state.completed.has(runId)) return;
        if (!reply) throw new Error("Run completed; reopen session history to view the reply");
        onChatEvent({ state: "final", runId, sessionId, text: reply.content, model: "saved reply", durationMs: (run.finishedAtMs ?? 0) - (run.startedAtMs ?? 0) });
      } else if (run.status === "aborted") onChatEvent({ state: "aborted", runId, sessionId });
      else if (run.status === "awaiting_input") await restorePendingForms(generation);
      else onChatEvent({ state: "error", runId, sessionId, error: run.error ?? "Run requires attention. Open session history." });
      return;
    }
    throw new Error("Status check timed out. Open session history to check the reply.");
  } catch (error) {
    if (generation === state.generation && !state.completed.has(runId)) setStatus(error.message);
  }
}

/** Show the forms still waiting for an answer (after a reconnect), each once. */
async function restorePendingForms(generation) {
  try {
    const response = await fetch(`${state.baseUrl}/api/hitl/pending`, { headers: state.headers });
    if (!response.ok || generation !== state.generation) return;
    const body = await response.json();
    if (generation !== state.generation) return;
    for (const request of body.requests ?? []) if (!state.forms.has(request.requestId)) showForm(request);
  } catch { /* a reconnect tries again */ }
}

/**
 * Follow an accepted answer (resumed, or approvalAccepted) to the continuation's saved reply.
 * GET /api/hitl/{requestId} names the run that continued after the answer (resumedRunId) once it has finished.
 */
async function recoverApproval(requestId, generation, baseUrl, headers) {
  let reachable = false, misses = 0;
  for (let attempt = 0; attempt < 220; attempt++) {
    await new Promise((resolve) => setTimeout(resolve, 3000));
    if (generation !== state.generation) return;
    try {
      const response = await fetch(`${baseUrl}/api/hitl/${encodeURIComponent(requestId)}`, { headers, signal: AbortSignal.timeout(10000) }).catch(() => null);
      // As in recoverRun: a gateway without the route answers 404, or (cross-origin) never answers.
      if (!response) { if (!reachable && ++misses >= 5) return; continue; }
      reachable = true;
      if (response.status === 404) return;
      if (!response.ok) { if (response.status >= 500 || response.status === 429) continue; throw new Error("Unable to check approval status"); }
      const request = await response.json();
      const runId = request.resumedRunId;
      if (generation !== state.generation || (runId && state.completed.has(runId))) return;
      if (runId) {
        const saved = await fetch(`${baseUrl}/api/sessions/${encodeURIComponent(request.sessionId)}`, { headers });
        if (!saved.ok) throw new Error("Unable to recover the saved reply");
        const session = await saved.json();
        const reply = session.messages?.filter((m) => m.runId === runId && m.role === "assistant").at(-1);
        if (generation !== state.generation || state.completed.has(runId)) return;
        if (reply) onChatEvent({ state: "final", runId, sessionId: request.sessionId, text: reply.content, model: "saved reply", durationMs: 0 });
        await restorePendingForms(generation);
      } else if (["pending", "responded", "cancelled"].includes(request.status)) continue;
      else setStatus(request.status === "expired" ? "The input request expired." : "The continuation failed. Check session history before retrying an action.");
      return;
    } catch { if (attempt === 219) setStatus("Could not recover the continuation. Check session history."); }
  }
}

async function send(text) {
  addBubble("me", text);
  await post({ message: text });
}

async function post(fields) {
  const generation = state.generation, baseUrl = state.baseUrl, headers = { ...state.headers };
  $("sendBtn").disabled = true;
  try {
    const res = await fetch(`${baseUrl}/api/chat`, {
      method: "POST",
      headers: { "content-type": "application/json", ...headers },
      body: JSON.stringify({ ...fields, sessionId: state.sessionId, idempotencyKey: crypto.randomUUID() }),
    });
    const body = await res.json().catch(() => ({}));
    if (generation !== state.generation) return;
    if (res.status === 202 && (body.approvalAccepted || body.resumed)) {
      setStatus("Response accepted. Continuing…");
      void recoverApproval(body.requestId, generation, baseUrl, headers);
    } else if (res.status === 202) {
      state.sessionId = body.sessionId;
      if (!state.ws) setStatus("Accepted, but there's no live stream to show the reply. Connect to real-time messaging.");
      void recoverRun(body.runId, body.sessionId, generation, baseUrl, headers);
    } else if (res.ok && typeof body.text === "string") {
      state.sessionId = body.sessionId ?? state.sessionId;
      addBubble("agent", body.text);
      setStatus("Done.");
    } else {
      addBubble("note", body.error ?? `HTTP ${res.status}`);
      setStatus(res.status === 429 ? "Rate limited." : "Request failed.");
    }
  } catch (err) {
    addBubble("note", `Network error: ${err.message}`);
  } finally {
    $("sendBtn").disabled = false;
  }
}

$("connect").addEventListener("submit", (e) => { e.preventDefault(); connect(); });
$("send").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("message").value.trim();
  if (!text) return;
  $("message").value = "";
  send(text);
});
